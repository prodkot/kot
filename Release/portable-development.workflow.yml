name: Windows portable development build
on:
  push:
    branches: ['dev/**']
  workflow_dispatch:
concurrency:
  group: portable-development-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  portable:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.x'
      - name: Verify development branch and core logic
        shell: pwsh
        run: |
          if (!$env:GITHUB_REF.StartsWith('refs/heads/dev/')) { throw 'Portable test builds require a dev branch.' }
          python Tests/repository.py
          if ($LASTEXITCODE -ne 0) { throw 'Repository checks failed.' }
          dotnet run --project Tests/Kot.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Build self-contained portable with Fixed Version WebView2
        shell: pwsh
        run: |
          ./Release/portable.ps1
          if ($LASTEXITCODE -ne 0) { throw 'Portable build failed.' }
      - name: Native portable storage, WebView2 and crash cleanup
        timeout-minutes: 5
        shell: pwsh
        run: |
          dotnet publish WindowTests/Kot.WindowTests.csproj -c Release -r win-x64 -m:1 -p:KotPortable=true -p:SelfContained=false -p:PublishSingleFile=false -o artifacts/portable-tests
          if ($LASTEXITCODE -ne 0) { throw 'Portable fixture build failed.' }
          Copy-Item artifacts/portable-payload/WebView2Runtime artifacts/portable-tests/WebView2Runtime -Recurse
          ./artifacts/portable-tests/Kot.WindowTests.exe --portable-checks artifacts/portable-verification
          if ($LASTEXITCODE -ne 0) { throw 'Portable isolation or native UI checks failed.' }
          ./artifacts/portable-tests/Kot.WindowTests.exe --services-test
          if ($LASTEXITCODE -ne 0) { throw 'Portable managed service cleanup failed.' }
      - name: Run the actual unpacked application and delete its folder
        timeout-minutes: 3
        shell: pwsh
        run: ./WindowTests/portable-package.ps1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: success()
        with:
          name: windows-portable-development
          path: |
            artifacts/Kot-Portable-*-Windows-x64.zip
            artifacts/Kot-Portable-*-Windows-x64.zip.sha256
          compression-level: 0
          retention-days: 30
          if-no-files-found: error
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: portable-verification
          path: artifacts/portable-verification
          retention-days: 30
          if-no-files-found: ignore
