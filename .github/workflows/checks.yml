name: Windows checks
on:
  push:
    branches: [main, 'dev/**']
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  website:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Repository consistency
        run: python3 Tests/repository.py
      - name: Website assets and download provenance
        run: python3 site/check.py
      - name: Interactive demo in Chromium
        run: |
          python3 -m pip install -r requirements-dev.txt
          python3 -m playwright install --with-deps chromium
          python3 site/demo_browser_check.py
          python3 Tests/ui.py
          python3 Tests/flags_ui.py
          python3 Tests/subscriptions_ui.py
          python3 Tests/routing_ui.py
          python3 Tests/statistics_ui.py
          python3 Tests/client_tools_ui.py
          python3 Tests/services_ui.py
          python3 Tests/ui_polish.py
          python3 Tests/ui_resilience.py
  integration:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - uses: actions/setup-go@90ad2b35f69faf97585ad74d28fa006d2739b7af
        with:
          go-version: '1.27.2'
          cache: false
      - name: Generate fixtures and check core logic
        run: dotnet run --project Tests/Kot.Tests.csproj -c Release
      - name: Build the pinned official Xray and exercise real native traffic
        run: |
          python3 Release/xray-core.py artifacts/core --target linux
          dotnet run --project Tests/Kot.Tests.csproj -c Release --no-build -- geoip-core artifacts/core/xray
          python3 Tests/xray_integration.py --core artifacts/core/xray
  tests:
    timeout-minutes: 10
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Core tests
        shell: pwsh
        run: |
          dotnet run --project Tests/Kot.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Native Windows process launcher
        shell: pwsh
        run: |
          dotnet publish NativeTests/Kot.NativeTests.csproj -c Release -r win-x64 --self-contained false -o artifacts/native-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture build failed.' }
          ./artifacts/native-tests/Kot.NativeTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher tests failed.' }
      - name: Native window and tray checks
        shell: pwsh
        run: |
          dotnet publish WindowTests/Kot.WindowTests.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=false -o artifacts/window-tests
          if ($LASTEXITCODE -ne 0) { throw 'Window fixture build failed.' }
          ./artifacts/window-tests/Kot.WindowTests.exe artifacts/window-ui
          if ($LASTEXITCODE -ne 0) { throw 'Window and tray checks failed.' }
      - name: Official zapret and Telegram managed services
        timeout-minutes: 5
        shell: pwsh
        env:
          KOT_TEST_GITHUB_TOKEN: ${{ github.token }}
        run: |
          ./artifacts/window-tests/Kot.WindowTests.exe --services-test
          if ($LASTEXITCODE -ne 0) { throw 'Managed service lifecycle or package checks failed.' }
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: tray-preview
          path: artifacts/window-ui/*
