name: Windows checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  website:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Website assets and download provenance
        run: python3 site/check.py
      - name: Interactive demo in Chromium
        run: |
          python3 -m pip install playwright==1.63.0
          python3 -m playwright install --with-deps chromium
          python3 site/demo_browser_check.py
          python3 Tests/flags_ui.py
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'
      - name: Core tests
        shell: pwsh
        run: |
          dotnet run --project Tests/Kot.Tests.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Core tests failed.' }
      - name: Native Windows process launcher
        shell: pwsh
        run: |
          dotnet publish NativeTests/Kot.NativeTests.csproj -c Release -r win-x64 --self-contained false -o artifacts/native-tests
          if ($LASTEXITCODE -ne 0) { throw 'Native fixture build failed.' }
          ./artifacts/native-tests/Kot.NativeTests.exe
          if ($LASTEXITCODE -ne 0) { throw 'Native launcher tests failed.' }
      - name: Native window and tray checks
        shell: pwsh
        run: |
          dotnet publish WindowTests/Kot.WindowTests.csproj -c Release -r win-x64 -p:SelfContained=false -p:PublishSingleFile=false -o artifacts/window-tests
          if ($LASTEXITCODE -ne 0) { throw 'Window fixture build failed.' }
          ./artifacts/window-tests/Kot.WindowTests.exe artifacts/window-ui
          if ($LASTEXITCODE -ne 0) { throw 'Window and tray checks failed.' }
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: tray-preview
          path: artifacts/window-ui/*.png
