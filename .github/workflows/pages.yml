name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'Windows/ui/**', 'licenses/**', 'LICENSE.txt', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Windows release']
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Prepare the current download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/prodkot/kot/releases/latest > "$RUNNER_TEMP/kot-release.json"
          python3 site/build.py --release "$RUNNER_TEMP/kot-release.json" --output artifacts/site
      # Keep the nested artifact action pinned as required by repository policy.
      - name: Archive the static site
        run: tar --dereference --hard-dereference --directory artifacts/site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
