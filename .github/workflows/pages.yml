name: Website
on:
  push:
    branches: [main]
    paths: ['site/**', 'Windows/ui/**', '.github/workflows/pages.yml']
  workflow_run:
    workflows: ['Windows release']
    types: [completed]
  release:
    types: [published]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  build:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: main
          persist-credentials: false
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Prepare the current download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/prodkot/kot/releases/latest > "$RUNNER_TEMP/kot-release.json"
          python3 site/build.py --release "$RUNNER_TEMP/kot-release.json" --output artifacts/site
      # Keep the nested artifact action pinned as required by repository policy.
      - name: Archive the static site
        run: tar --dereference --hard-dereference --directory artifacts/site -cf "$RUNNER_TEMP/artifact.tar" .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
